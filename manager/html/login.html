<section class="login-view" id="loginView">
    <form class="login-card" id="loginForm" autocomplete="off">
      <div class="manager-brand">
        <span>AECOMPU</span>
        <strong>SUPER<span>LEAGUE</span></strong>
      </div>
      <p class="eyebrow">TOURNAMENT MANAGER</p>
      <h1>Panel de control</h1>
      <p class="muted">Acceso reservado para la organización del torneo.</p>
      <label for="managerPassword">Contraseña</label>
      <div class="password-row">
        <input id="managerPassword" name="password" type="password" required autocomplete="current-password" placeholder="••••••••••••">
        <button id="togglePassword" class="icon-btn" type="button" aria-label="Mostrar u ocultar contraseña">VER</button>
      </div>
      <p class="login-error" id="loginError" role="alert" hidden>Contraseña incorrecta.</p>
      <button class="primary-btn" type="submit">ENTRAR AL MANAGER</button>
      <a class="back-link" href="../index.html">← Volver a la vista pública</a>
    </form>
  </section>
